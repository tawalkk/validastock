name: Deploy private Bluesoft lookup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BLUESOFT_COSMOS_TOKEN: ${{ secrets.BLUESOFT_COSMOS_TOKEN }}
          BLUESOFT_COSMOS_USER_AGENT: ${{ secrets.BLUESOFT_COSMOS_USER_AGENT }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          test -n "$BLUESOFT_COSMOS_TOKEN" || (echo "Missing BLUESOFT_COSMOS_TOKEN repository secret" && exit 1)
          test -n "$BLUESOFT_COSMOS_USER_AGENT" || (echo "Missing BLUESOFT_COSMOS_USER_AGENT repository secret" && exit 1)
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Store Bluesoft credentials in Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BLUESOFT_COSMOS_TOKEN: ${{ secrets.BLUESOFT_COSMOS_TOKEN }}
          BLUESOFT_COSMOS_USER_AGENT: ${{ secrets.BLUESOFT_COSMOS_USER_AGENT }}
        run: >-
          supabase secrets set
          "BLUESOFT_COSMOS_TOKEN=$BLUESOFT_COSMOS_TOKEN"
          "BLUESOFT_COSMOS_USER_AGENT=$BLUESOFT_COSMOS_USER_AGENT"
          --project-ref yyegkdtbkbtpwyrnbfhk
      - name: Deploy lookup function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy cosmos-gtin --project-ref yyegkdtbkbtpwyrnbfhk
